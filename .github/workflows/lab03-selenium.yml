name: Lab 03 - Compile Selenium tests

on:
  push:
    paths:
      - 'software_testing/lab_03_selenium/**'
      - '.github/workflows/lab03-selenium.yml'
  pull_request:
    paths:
      - 'software_testing/lab_03_selenium/**'
      - '.github/workflows/lab03-selenium.yml'

# Browser tests target an actual Litecart installed on the student's computer.
# GitHub runners cannot reach that localhost site, so CI only compiles the project.
jobs:
  compile:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile Selenium tests using the Maven Wrapper
        working-directory: software_testing/lab_03_selenium
        shell: pwsh
        run: .\mvnw.cmd -B -DskipTests test
