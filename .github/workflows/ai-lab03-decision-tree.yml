name: AI Lab 03 - Decision tree

on:
  push:
    paths:
      - 'artificial_intelligence/lab_03_decision_tree/**'
      - '.github/workflows/ai-lab03-decision-tree.yml'
  pull_request:
    paths:
      - 'artificial_intelligence/lab_03_decision_tree/**'
      - '.github/workflows/ai-lab03-decision-tree.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: artificial_intelligence/lab_03_decision_tree
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python main.py --variant 1
      - run: python main.py --variant 11
