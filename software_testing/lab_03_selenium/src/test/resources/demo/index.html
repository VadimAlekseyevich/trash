<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rubber Ducks | My Store</title>
  <style>
    body { margin: 0; font: 17px/1.5 system-ui, sans-serif; color: #243245; background: #f3f5fa; }
    header { background: #283e68; padding: 20px max(8%, 24px); color: white; }
    header strong { font-size: 25px; }
    main { max-width: 950px; padding: 35px 24px; margin: 0 auto; }
    .hint { background: #e8effd; padding: 12px 16px; border-radius: 8px; }
    .product { display: inline-block; width: 260px; margin-top: 24px; text-decoration: none;
               background: white; border-radius: 14px; padding: 28px; color: #243245;
               box-shadow: 0 5px 20px #1026471a; }
    .product:hover { box-shadow: 0 6px 26px #4b479966; }
    .duck { font-size: 100px; text-align: center; background: #eee9ff; border-radius: 12px; }
    .name { display: block; font-size: 22px; font-weight: bold; margin-top: 20px; }
  </style>
</head>
<body>
  <header><strong>My Store</strong> &nbsp; / &nbsp; Rubber Ducks</header>
  <main>
    <h1>Rubber Ducks</h1>
    <p class="hint">Локальный учебный демосайт для проверки Selenium. Это не настоящий Litecart.</p>
    <a class="product" href="purple-duck.html">
      <div class="duck" aria-hidden="true">🦆</div>
      <span class="name">Purple Duck</span>
      <span>Click to view product details</span>
    </a>
  </main>
</body>
</html>
